<form class="aip-checklist" method="post" action="{% url 'aa_industry_planner:check_plan_item' plan.pk item_id %}" data-checklist data-item-id="{{ item_id }}">
  {% csrf_token %}<label><input class="form-check-input" type="checkbox" name="checked" aria-label="Reviewed: {{ item_name }}" {% if checked %}checked{% endif %} {% if plan.archived %}disabled{% endif %}> Reviewed</label>
  {% if not plan.archived %}<button class="btn btn-link btn-sm" data-checklist-save>Save</button>{% endif %}<span class="aip-checklist-feedback" role="status"></span>
</form>
