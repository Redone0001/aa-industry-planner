<div class="mb-3 {{ field_class|default:'' }} {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% endif %}
  {{ field.errors }}
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
</div>
