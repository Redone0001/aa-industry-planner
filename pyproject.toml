[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-industry-planner"
version = "0.3.1"
description = "Production planning, inventory and industry operations for Alliance Auth"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "allianceauth>=5.6,<6",
  "django-esi>=10.1,<11",
  "django-eveonline-sde>=0.2,<3",
  "django-eveuniverse>=2.2,<3",
  "django-modeltranslation>=0.19,<0.21",
]

[project.urls]
Repository = "https://github.com/Redone0001/aa-industry-planner"

[project.optional-dependencies]
discord = ["allianceauth-discord-multiverse>=0.0.1"]
test = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.11", "build"]

[tool.setuptools.packages.find]
include = ["aa_industry_planner*"]

[tool.setuptools.package-data]
aa_industry_planner = ["templates/**/*.html", "static/**/*", "locale/**/*", "data/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
